name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Bundle budget
        run: |
          total=$(du -cb dist/assets/*.js | tail -1 | cut -f1)
          gz=$(cat dist/assets/*.js | gzip -9 | wc -c)
          echo "JS: $total bytes raw, $gz bytes gzip"
          test "$gz" -le 1572864
