version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # three and @types/three are pinned together; bump them as a pair.
      three:
        patterns: ['three', '@types/three']
      dev-deps:
        dependency-type: development
        exclude-patterns: ['@types/three']
        update-types: [minor, patch]
